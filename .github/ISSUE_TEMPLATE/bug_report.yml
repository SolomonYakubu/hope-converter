name: Bug report
description: Something in Hope Converter does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a 4K MOV to the queue
        2. Choose MP4 / Balanced
        3. Start the conversion
    validations:
      required: true

  - type: input
    id: conversion
    attributes:
      label: Conversion
      description: Input format, output format, and the settings you used.
      placeholder: MOV to MP4, Balanced, hardware acceleration on, 2 at once
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: The message the app displayed, if any. Paste it as text.

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.3 (Apple Silicon), Windows 11, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Hope Converter version
      description: From the About dialog, or the commit you built.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I have removed private file names, paths, and other personal details from this report.
          required: true
