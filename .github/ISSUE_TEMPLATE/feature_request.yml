name: Feature request
description: Suggest a capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task you are stuck on rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Optional. How you imagine it working.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This works entirely on the user's own device and does not upload or send files anywhere.
          required: true
