name: Release

# Signing is decided entirely by which secrets exist. With none of them set,
# every job still succeeds and produces the same unsigned artifacts as a local
# `npm run dist`, so this workflow is safe to merge before any certificate has
# been bought. `electron-builder.cjs` documents how each variable is read.
#
# Each runner builds only its own architecture on purpose: `npm ci` downloads
# FFmpeg and ffprobe for the host, so a cross-built app would carry binaries it
# cannot execute. Intel Macs need a separate Intel runner rather than `--x64`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      # Present at job level only so the step below can test whether it is set.
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Downloads the FFmpeg and ffprobe binaries for this runner.
      - run: npm ci

      - run: npm test

      # @electron/notarize wants a path to the .p8 rather than its contents, so
      # the base64 secret has to become a file before electron-builder runs.
      - name: Write App Store Connect API key
        if: runner.os == 'macOS' && env.APPLE_API_KEY_BASE64 != ''
        run: |
          key_dir="$RUNNER_TEMP/private_keys"
          mkdir -p "$key_dir"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey.p8"
          echo "APPLE_API_KEY=$key_dir/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build installers
        env:
          # The certificates are scoped per platform deliberately.
          # electron-builder falls back to CSC_LINK when WIN_CSC_LINK is unset,
          # so leaking the Apple certificate onto the Windows runner would make
          # signtool try to sign with it and fail the build.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run dist -- --publish never

      - name: Confirm the macOS signature
        if: runner.os == 'macOS'
        run: |
          app="release/mac${{ runner.arch == 'ARM64' && '-arm64' || '' }}/Hope Converter.app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature' || true
          spctl -a -vvv -t install "$app" || echo 'Gatekeeper rejects this build (expected while unsigned).'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  release:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Left as a draft so the tag can be built and the binaries checked before
      # anyone can download them. Publish it from the Releases page.
      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
